// Gradle module of Metrolist's local Capacitor plugin. `npx cap sync` includes it in the generated
// android/ project as `:metrolist-capacitor-background-playback` (capacitor.settings.gradle) and the
// app depends on it (capacitor.build.gradle). Versions follow the app's variables.gradle (Capacitor 6:
// compileSdk 34, minSdk 22, targetSdk 34), with the same fallbacks as @capacitor/android itself.
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxCoreVersion = project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.12.0'
    androidxWebkitVersion = project.hasProperty('androidxWebkitVersion') ? rootProject.ext.androidxWebkitVersion : '1.9.0'
    androidxMediaVersion = project.hasProperty('androidxMediaVersion') ? rootProject.ext.androidxMediaVersion : '1.7.0'
}

apply plugin: 'com.android.library'

android {
    namespace "com.metrolist.backgroundplayback"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        // The JUnit test reads the rules asset the app ships (and the vectors shared with the TS tests)
        test.resources.srcDirs += ['src/main/assets']
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    // A real org.json for the JVM unit test (android.jar only has stubs), as @capacitor/android does
    testImplementation 'org.json:json:20231013'
}
