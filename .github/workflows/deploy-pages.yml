name: CI Build & Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run core security & InnerTube unit tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser tests (hermetic, fake YouTube player)
        run: npm run test:e2e

      # The desktop app's main process (Electron) with the built frontend, under a virtual display.
      # Hermetic like the browser suite; about half a minute.
      - name: Run desktop app (Electron) tests
        run: |
          npm run build:electron
          xvfb-run -a npx playwright test -c playwright.electron.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-electron/
          retention-days: 14
