name: CI Build & Test

# Runs once per change: on the pull request into main (GitHub tests the PR merged onto main, i.e. the
# tree main will have after the merge). It no longer re-runs on the push that merging creates: that was
# the same code tested twice. Manual runs stay possible.
#
# Layout (same checks as before, run in parallel instead of one after another):
#   changes              decides whether anything other than documentation changed (a few seconds)
#   unit-and-typecheck   npm test + npm run lint
#   browser-e2e          production build + Playwright browser projects (Playwright browsers cached)
#   desktop-electron     production build + Electron main process suite under Xvfb
#   build-and-test       the single gate: passes when every job above passed, or was skipped because the
#                        pull request touched only documentation. Protect main (Settings → Branches:
#                        require "build-and-test" to pass and the branch to be up to date before merging)
#                        so nothing reaches main untested. Require ONLY this job: the others may be skipped.
on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run that is still testing the older commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # code=false only when EVERY changed file is documentation. Anything else, or an empty / failed
      # diff, means code=true (fail safe: run everything). Event values come in through env, never
      # interpolated into the script.
      - name: Decide whether code changed
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: running everything."
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF" || true
          files="$(git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}" 2>/dev/null || true)"

          code=false
          if [ -z "$files" ]; then
            code=true
            echo "Empty or failed diff: running everything."
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md|docs/*|LICENSE*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
                *) code=true; echo "Code change: $f"; break ;;
              esac
            done <<< "$files"
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  unit-and-typecheck:
    name: Unit tests & typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run core security & InnerTube unit tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run lint

  browser-e2e:
    name: Browser end-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser download is cached; the system libraries are not.
      - name: Install Playwright system libraries (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run end-to-end browser tests (hermetic, fake YouTube player)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser
          path: playwright-report/
          retention-days: 14

  desktop-electron:
    name: Desktop app (Electron) tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      # The desktop app's main process (Electron) with the built frontend, under a virtual display.
      # Hermetic like the browser suite. Electron needs no Playwright browser download.
      - name: Run desktop app (Electron) tests
        run: xvfb-run -a npx playwright test -c playwright.electron.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-electron
          path: playwright-report-electron/
          retention-days: 14

  # The one required check (keep this job id and name). Runs even when a needed job failed or was skipped.
  build-and-test:
    name: build-and-test
    needs: [changes, unit-and-typecheck, browser-e2e, desktop-electron]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          UNIT_RESULT: ${{ needs.unit-and-typecheck.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          ELECTRON_RESULT: ${{ needs.desktop-electron.result }}
        run: |
          fail=0
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes: $CHANGES_RESULT"
            fail=1
          fi
          for pair in "unit-and-typecheck=$UNIT_RESULT" "browser-e2e=$BROWSER_RESULT" "desktop-electron=$ELECTRON_RESULT"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" = "success" ]; then
              echo "$name: success"
            elif [ "$result" = "skipped" ] && [ "$CODE" != "true" ]; then
              echo "$name: skipped (documentation-only change)"
            else
              echo "$name: $result"
              fail=1
            fi
          done
          exit "$fail"
