name: Build & Publish Release Artifacts (macOS, Windows, Android, iOS, Web)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      publish:
        description: "Publish a GitHub Release (untick to only build and upload the artifacts, e.g. to test-build a branch)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  # 1. Verify Tests, TypeScript & Build Web Production Bundle
  verify-and-bundle-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests & security checks
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production web bundle
        run: npm run build

      # `npm run build` produced dist/ (frontend) and dist-server/server.mjs (the server with every
      # dependency bundled), so the archive runs with Node.js alone: no npm install needed.
      - name: Archive Portable Web & Full-Stack Server Release
        run: |
          7z a -tzip metrolist-portable-web-and-server.zip dist dist-server package.json README.md

      - name: Verify the portable archive starts from a clean directory
        run: |
          tmp="$(mktemp -d)"
          unzip -q metrolist-portable-web-and-server.zip -d "$tmp"
          test ! -e "$tmp/node_modules"
          (cd "$tmp" && PORT=3080 exec node dist-server/server.mjs > server.log 2>&1) &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3080/manifest.webmanifest && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3080/
          curl -sf -o /dev/null http://localhost:3080/manifest.webmanifest
          cat "$tmp/server.log"
          kill "$server_pid" || true

      - name: Upload Web & Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-web-release
          path: metrolist-portable-web-and-server.zip

  # 2. Build Native Desktop Packages (macOS & Windows)
  build-desktop-native:
    needs: verify-and-bundle-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macos-universal
          - os: windows-latest
            platform_name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & build frontend
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build

      - name: Package Native Desktop Standalone Archive
        shell: bash
        run: |
          mkdir -p release-desktop
          7z a -tzip "release-desktop/metrolist-${{ matrix.platform_name }}-standalone.zip" dist dist-server package.json README.md

      - name: Upload Desktop Artifact (${{ matrix.platform_name }})
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-desktop-${{ matrix.platform_name }}
          path: release-desktop/*

  # 3. Build Android (.apk) & iOS Project Bundle via Capacitor
  build-mobile-bundles:
    needs: verify-and-bundle-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies & build web assets
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build

      - name: Generate Android & iOS Native Capacitor Projects & Build APK
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/ios@6
          npx cap add android
          npx cap add ios
          npx cap sync
          mkdir -p release-mobile
          if [ -d "android" ]; then
            if [ -n "$ANDROID_HOME" ]; then
              echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            elif [ -d "/usr/local/lib/android/sdk" ]; then
              echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
            fi
            chmod +x android/gradlew
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk release-mobile/metrolist-android-universal.apk
            7z a -tzip release-mobile/metrolist-android-studio-project.zip android capacitor.config.json
          fi
          if [ -d "ios" ]; then
            7z a -tzip release-mobile/metrolist-ios-xcode-project.zip ios capacitor.config.json
          fi

      - name: Upload Mobile Native Artifacts (Android APK + iOS Xcode Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-mobile-native
          path: release-mobile/*

  # 4. Publish All Platform Builds to GitHub Releases
  # Skipped for a manual run with "publish" unticked (artifacts are still uploaded to the run).
  publish-github-release:
    needs: [verify-and-bundle-web, build-desktop-native, build-mobile-bundles]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "Metrolist Cross-Platform Release (${{ inputs.release_tag || github.ref_name }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
