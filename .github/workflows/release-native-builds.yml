name: Build & Publish Release Artifacts (macOS, Windows, Linux, Android, iOS, Web)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      publish:
        description: "Publish a GitHub Release (untick to only build and upload the artifacts, e.g. to test-build a branch)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  # 1. Verify Tests, TypeScript & Build Web Production Bundle
  verify-and-bundle-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests & security checks
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production web bundle
        run: npm run build

      - name: Check bundle size budget
        run: npm run check:budget

      # `npm run build` produced dist/ (frontend) and dist-server/server.mjs (the server with every
      # dependency bundled), so the archive runs with Node.js alone: no npm install needed.
      - name: Archive Portable Web & Full-Stack Server Release
        run: |
          7z a -tzip metrolist-portable-web-and-server.zip dist dist-server package.json README.md

      - name: Verify the portable archive starts from a clean directory
        run: |
          tmp="$(mktemp -d)"
          unzip -q metrolist-portable-web-and-server.zip -d "$tmp"
          test ! -e "$tmp/node_modules"
          (cd "$tmp" && PORT=3080 exec node dist-server/server.mjs > server.log 2>&1) &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3080/manifest.webmanifest && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3080/
          curl -sf -o /dev/null http://localhost:3080/manifest.webmanifest
          cat "$tmp/server.log"
          kill "$server_pid" || true

      - name: Upload Web & Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-web-release
          path: metrolist-portable-web-and-server.zip

  # 2. Native desktop apps (Electron + electron-builder): a universal macOS .dmg, Windows NSIS
  #    installers (x64, arm64) and Linux AppImage + .deb (x64, arm64). Each job smoke-tests the packaged
  #    app for the runner's own architecture (METROLIST_SMOKE_TEST=1) before uploading.
  #    The build jobs do not wait for verify-and-bundle-web (it is the test gate for publishing).
  build-desktop-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macos-universal
            artifact_glob: release/*.dmg
          - os: windows-latest
            platform_name: windows
            artifact_glob: release/*-setup.exe
          - os: ubuntu-latest
            platform_name: linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # CLAUDE.md §5 (lockfile handling): without the lockfile npm fetches this OS's native optional binaries
      # (@rollup/rollup-*, @tailwindcss/oxide-*). npm 11 is used for this install because npm 10
      # ignores the scoped minimatch overrides in package.json when it resolves without a lockfile;
      # `npm ls minimatch` fails the job if an override was not applied.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npx -y npm@11.21.1 install --legacy-peer-deps
          npm ls minimatch

      - name: Set the app version from the release tag (no commit)
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "Building Metrolist $version"

      - name: Build frontend, server and main process
        run: |
          npm run build
          npm run build:electron

      # Real signing is picked up automatically once these repository secrets exist:
      #   CSC_LINK (base64 .p12 Developer ID Application certificate), CSC_KEY_PASSWORD,
      #   and for notarization APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
      # Without a certificate the app is ad-hoc signed (identity "-"), without hardened runtime:
      # an unsigned arm64 app is killed on Apple Silicon. Ad-hoc apps are never notarized.
      - name: Package macOS app (universal .dmg)
        if: runner.os == 'macOS'
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing=()
          if [ -n "$SECRET_CSC_LINK" ]; then
            echo "Signing with the Developer ID certificate from CSC_LINK"
            export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
            if [ -n "$SECRET_APPLE_ID" ]; then
              export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
            fi
          else
            echo "No CSC_LINK secret: ad-hoc signing"
            signing=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.timestamp=none)
          fi
          npx electron-builder --mac --universal --publish never "${signing[@]}"

      - name: Verify the macOS signature and architectures
        if: runner.os == 'macOS'
        run: |
          app="release/mac-universal/Metrolist.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1
          lipo -archs "$app/Contents/MacOS/Metrolist"
          lipo -archs "$app/Contents/MacOS/Metrolist" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/Metrolist" | grep -q x86_64

      - name: Smoke-test the packaged macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: METROLIST_SMOKE_TEST=1 release/mac-universal/Metrolist.app/Contents/MacOS/Metrolist

      - name: Package Windows installer (NSIS, x64)
        if: runner.os == 'Windows'
        env:
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_WIN_CSC_LINK" ]; then
            export WIN_CSC_LINK="$SECRET_WIN_CSC_LINK" WIN_CSC_KEY_PASSWORD="$SECRET_WIN_CSC_KEY_PASSWORD"
          fi
          npx electron-builder --win --x64 --arm64 --publish never

      # A GUI-subsystem exe's stdout may not reach the log, so the verdict is also written to a file;
      # the exit code alone decides.
      - name: Smoke-test the packaged Windows app
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'metrolist-smoke.txt'
          $env:METROLIST_SMOKE_TEST = '1'
          $env:METROLIST_SMOKE_TEST_REPORT = $report
          $proc = Start-Process -FilePath 'release\win-unpacked\Metrolist.exe' -Wait -PassThru -NoNewWindow
          if (Test-Path $report) { Get-Content $report } else { Write-Host 'METROLIST SMOKE TEST: no report written' }
          $code = $proc.ExitCode
          Write-Host "Exit code: $code"
          if ($null -eq $code -or $code -ne 0) { exit 1 }

      - name: Package Linux AppImage + .deb (x64, arm64)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --x64 --arm64 --publish never

      # Under a virtual display; --no-sandbox because Ubuntu 24.04's AppArmor blocks Chromium's sandbox
      # for an unpacked app (the .deb installs chrome-sandbox setuid; the AppImage may need the flag too).
      - name: Smoke-test the packaged Linux app (x64)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          sudo apt-get install -y --no-install-recommends xvfb > /dev/null
          xvfb-run -a env METROLIST_SMOKE_TEST=1 release/linux-unpacked/metrolist --no-sandbox
          dpkg-deb --info release/*-linux-amd64.deb | grep -E 'Package|Version|Architecture'

      - name: Upload desktop installer (${{ matrix.platform_name }})
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-desktop-${{ matrix.platform_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # 3a. Android via Capacitor 6. `npm run native:prepare` installs Metrolist's MainActivity
  #     (native/android-app/MainActivity.java), whose WebView keeps playing when the app is
  #     minimised; the job proves the APK carries it. The version comes from the release tag.
  #     With the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
  #     ANDROID_KEY_PASSWORD secrets it ships a signed release APK + .aab (Play Store), signed with the
  #     same key every release, so updates install over the previous version. Without them it ships a
  #     debug APK (signed with a throw-away key: uninstall the old version before installing it).
  build-mobile-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # The local Capacitor plugin (native/capacitor-background-playback: background play and ad
      # blocking) is a `file:` devDependency, so this install links it into node_modules/@metrolist/
      # before `cap sync` looks for plugins.
      - name: Install dependencies & build web assets
        run: |
          npm ci --legacy-peer-deps
          test -f node_modules/@metrolist/capacitor-background-playback/package.json
          npm run build

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'native/capacitor-background-playback/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate & prepare the Android project, build the APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          # Installs Metrolist's MainActivity over the generated one (fails if it is not Capacitor's default)
          npm run native:prepare
          npm run native:prepare -- --check
          grep -q 'com.metrolist.backgroundplayback.R.layout.metrolist_bridge_layout_main' android/app/src/main/java/com/metrolist/music/MainActivity.java
          # cap sync must have registered the local plugin (Gradle module :metrolist-capacitor-background-playback)
          grep -q '"com.metrolist.backgroundplayback.BackgroundPlaybackPlugin"' android/app/src/main/assets/capacitor.plugins.json
          grep -q "metrolist-capacitor-background-playback" android/capacitor.settings.gradle
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi
          chmod +x android/gradlew

          # Version from the tag: versionName X.Y.Z, versionCode X*10000 + Y*100 + Z (always increasing)
          version="${RELEASE_TAG#v}"
          version="${version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$version"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]] || [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "Release tag '$RELEASE_TAG' is not vX.Y.Z (minor and patch <= 99)" >&2
            exit 1
          fi
          code=$((major * 10000 + minor * 100 + patch))
          sed -i -E "s/versionCode [0-9]+/versionCode $code/; s/versionName \"[^\"]*\"/versionName \"$version\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          echo "VERSION=$version" >> "$GITHUB_ENV"

          # The plugin's JUnit tests run the ad-block and system-pause-guard vectors shared with the TypeScript tests
          tasks=(:metrolist-capacitor-background-playback:testDebugUnitTest)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets found: building the signed release APK + .aab"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export METROLIST_KEYSTORE="$RUNNER_TEMP/release.keystore" METROLIST_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
              METROLIST_KEY_ALIAS="$KEY_ALIAS" METROLIST_KEY_PASSWORD="$KEY_PASSWORD"
            # A second android {} block (Groovy merges it): the release build type is signed from the environment
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  metrolistRelease {
                      storeFile file(System.getenv('METROLIST_KEYSTORE'))
                      storePassword System.getenv('METROLIST_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('METROLIST_KEY_ALIAS')
                      keyPassword System.getenv('METROLIST_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.metrolistRelease
                  }
              }
          }
          GRADLE
            tasks+=(assembleRelease bundleRelease)
            echo "APK=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: building the debug APK"
            tasks+=(assembleDebug)
            echo "APK=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          (cd android && ./gradlew "${tasks[@]}" --no-daemon)

      - name: Archive the APK (+ .aab) and the Android Studio project
        run: |
          mkdir -p release-mobile
          if [ "$SIGNED" = true ]; then
            cp "$APK" "release-mobile/Metrolist-$VERSION-android.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "release-mobile/Metrolist-$VERSION-android.aab"
            # The signature: the same certificate on every release
            "$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ | sort -V | tail -1)apksigner" verify --print-certs "$APK" | head -5
          else
            cp "$APK" "release-mobile/Metrolist-$VERSION-android-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.keystore"
          7z a -tzip release-mobile/metrolist-android-studio-project.zip android capacitor.config.json -xr'!build' -xr'!.gradle'

      - name: Upload Android Artifacts (APK + Android Studio project)
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-mobile-native
          path: release-mobile/*

      # After the upload on purpose: the APK can be tried even if a check fails, and the job still fails.
      - name: Verify the APK (background-playback WebView, layout, plugin assets)
        run: |
          apk="$APK"
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # The plugin's assets (page-visibility script, ad-block rules)
          unzip -l "$apk" | grep -q 'assets/metrolist-page-visibility.js'
          unzip -l "$apk" | grep -q 'assets/metrolist-ad-block-rules.json'
          # The dex files carry the WebView subclass and the app's MainActivity
          unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/classes.dex.bin"
          grep -a -q 'Lcom/metrolist/backgroundplayback/BackgroundPlaybackWebView;' "$RUNNER_TEMP/classes.dex.bin"
          grep -a -q 'Lcom/metrolist/music/MainActivity;' "$RUNNER_TEMP/classes.dex.bin"
          # The merged layout inflates the subclass with Capacitor's @id/webview
          layout="$(unzip -Z1 "$apk" | grep -E '^res/layout[^/]*/metrolist_bridge_layout_main\.xml$' | head -1)"
          test -n "$layout" || { echo "metrolist_bridge_layout_main.xml is not in the APK" >&2; unzip -Z1 "$apk" | grep '^res/layout' | head -50; exit 1; }
          aapt2="$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -1)aapt2"
          if [ -x "$aapt2" ]; then
            "$aapt2" dump xmltree --file "$layout" "$apk" | tee "$RUNNER_TEMP/layout.txt"
            ids="$("$aapt2" dump resources "$apk" | grep -E ' id/webview( |$)' || true)"
          else
            analyzer="$sdk/cmdline-tools/latest/bin/apkanalyzer"
            "$analyzer" resources xml --file "$layout" "$apk" | tee "$RUNNER_TEMP/layout.txt"
            ids=""
          fi
          grep -q 'com.metrolist.backgroundplayback.BackgroundPlaybackWebView' "$RUNNER_TEMP/layout.txt"
          if grep -q 'com.getcapacitor.CapacitorWebView' "$RUNNER_TEMP/layout.txt"; then
            echo "the swapped layout still uses CapacitorWebView" >&2
            exit 1
          fi
          # Only one id/webview resource exists, and the layout uses it (when aapt2 printed both)
          echo "id/webview: $ids"
          webview_id="$(printf '%s\n' "$ids" | grep -oE '0x7f[0-9a-f]{6}' | head -1)"
          if [ -n "$webview_id" ]; then
            test "$(printf '%s\n' "$ids" | grep -c 'id/webview')" -eq 1
            grep -q -e "=@$webview_id" -e '@id/webview' -e '@+id/webview' "$RUNNER_TEMP/layout.txt" || { echo "the layout's id is not @id/webview ($webview_id)" >&2; exit 1; }
          fi

  # 3b. iOS via Capacitor 6 (CocoaPods): compiled for the simulator (proves the Swift plugin compiles
  #     against Capacitor 6, the WebKit content-blocker list compiles, the Swift guard passes the shared
  #     vectors) and for devices without signing: an unsigned .ipa that sideloading tools (AltStore,
  #     Sideloadly) sign with the listener's own Apple ID. A signed App Store / TestFlight build needs a
  #     paid Apple Developer account. Not a device test: background audio and the lock screen still need
  #     a phone.
  build-ios-app:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # CLAUDE.md §5 (lockfile handling): macOS installs without the lockfile, with npm 11
      - name: Install dependencies & build web assets
        run: |
          rm -f package-lock.json
          npx -y npm@11.21.1 install --legacy-peer-deps
          test -f node_modules/@metrolist/capacitor-background-playback/package.json
          npm run build

      - name: Run the shared vectors against the Swift guard
        working-directory: native/capacitor-background-playback
        run: |
          swiftc ios/Plugin/SystemPauseGuard.swift ios/Tests/main.swift -o "$RUNNER_TEMP/guard-vectors"
          "$RUNNER_TEMP/guard-vectors" android/src/test/resources/system-pause-guard-vectors.json

      - name: Generate & prepare the iOS project
        run: |
          npx -y npm@11.21.1 install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap add ios
          npx cap sync ios
          # Adds UIBackgroundModes audio to Info.plist
          npm run native:prepare
          npm run native:prepare -- --check
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' ios/App/App/Info.plist | grep -q audio
          # cap sync must have added the local plugin's pod and registered its class
          grep -q "pod 'MetrolistCapacitorBackgroundPlayback'" ios/App/Podfile
          grep -q 'MetrolistCapacitorBackgroundPlayback' ios/App/Podfile.lock
          grep -q '"BackgroundPlaybackPlugin"' ios/App/App/capacitor.config.json

      - name: Compile the iOS app for the simulator (no signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { tail -200 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/xcodebuild.log"
          app="$RUNNER_TEMP/ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$app"
          # The plugin's framework with its resources, and background audio
          find "$app" -type d -name 'MetrolistCapacitorBackgroundPlayback.framework' | grep -q .
          find "$app" -name 'metrolist-content-blocker.json' | grep -q .
          find "$app" -name 'metrolist-page-visibility.js' | grep -q .
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$app/Info.plist" | grep -qx audio

      # Release build for devices with signing off; the .app goes into Payload/ and is zipped as an .ipa.
      # Version from the tag (MARKETING_VERSION / CURRENT_PROJECT_VERSION, same numbers as Android).
      - name: Build the unsigned iOS app (.ipa) for devices
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          version="${version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$version"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          build=$((major * 10000 + minor * 100 + patch))
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build" \
            build > "$RUNNER_TEMP/xcodebuild-device.log" 2>&1 \
            || { tail -200 "$RUNNER_TEMP/xcodebuild-device.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild-device.log"
          app="$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$app/Info.plist" | grep -qx audio
          lipo -archs "$app/App" | grep -q arm64
          mkdir -p "$RUNNER_TEMP/ipa/Payload" release-mobile
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/release-mobile/Metrolist-$version-ios-unsigned.ipa" Payload)
          unzip -l "release-mobile/Metrolist-$version-ios-unsigned.ipa" | grep -q 'Payload/App.app/Info.plist'

      - name: Archive the prepared Xcode project
        run: |
          mkdir -p release-mobile
          7z a -tzip release-mobile/metrolist-ios-xcode-project.zip ios capacitor.config.json -xr'!build'

      - name: Upload iOS Artifacts (unsigned .ipa + prepared Xcode project)
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-ios-native
          path: release-mobile/*

      # After the upload on purpose: the artifact exists even if this check fails, and the job still fails.
      # WebKit's own compiler (macOS, same content-extension parser as iOS) must accept the generated list,
      # or the app would run without ad blocking (it logs the compile error).
      - name: Compile the content-blocker list with WebKit
        working-directory: native/capacitor-background-playback
        timeout-minutes: 5
        run: swift ios/Tests/compile-content-blocker.swift ios/Resources/metrolist-content-blocker.json

  # 4. Publish All Platform Builds to GitHub Releases
  # Skipped for a manual run with "publish" unticked (artifacts are still uploaded to the run).
  publish-github-release:
    needs: [verify-and-bundle-web, build-desktop-installers, build-mobile-bundles, build-ios-app]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # A checksum file for every download, and a "which file do I need" table above the generated notes
      - name: Checksums and download guide
        run: |
          cd release-assets
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-body.md" <<'EOF'
          ## Downloads

          | Device | File |
          |---|---|
          | **macOS** (Apple Silicon and Intel) | `Metrolist-<version>-mac-universal.dmg`: open it, drag Metrolist to Applications; the first time, right-click → Open (not notarized) |
          | **Windows** (most PCs) | `Metrolist-<version>-win-x64-setup.exe`; SmartScreen: More info → Run anyway |
          | **Windows on ARM** (Snapdragon PCs) | `Metrolist-<version>-win-arm64-setup.exe` |
          | **Linux** (Ubuntu, Debian, Mint, …) | `Metrolist-<version>-linux-amd64.deb` (`sudo apt install ./Metrolist-…-linux-amd64.deb`), or `-linux-arm64.deb` on ARM |
          | **Linux** (any distribution) | `Metrolist-<version>-linux-x86_64.AppImage` or `-linux-arm64.AppImage`: make it executable and run it (add `--no-sandbox` if it does not start) |
          | **Android** | `Metrolist-<version>-android.apk` (signed release; the `.aab` is for Google Play), or `-android-debug.apk` when the release is not signed (uninstall the previous version first) |
          | **iOS / iPadOS** | `Metrolist-<version>-ios-unsigned.ipa`: install with AltStore or Sideloadly, which sign it with your Apple ID (untested on a device) |
          | **Web / your own server** | `metrolist-portable-web-and-server.zip`: unzip, run `node dist-server/server.mjs`, open http://localhost:3000 |

          Check a download with `SHA256SUMS.txt` (`sha256sum -c SHA256SUMS.txt --ignore-missing`). The Android Studio and Xcode project zips are for building the apps yourself.
          EOF
          echo "BODY_PATH=$RUNNER_TEMP/release-body.md" >> "$GITHUB_ENV"

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "Metrolist Cross-Platform Release (${{ inputs.release_tag || github.ref_name }})"
          draft: false
          prerelease: false
          body_path: ${{ env.BODY_PATH }}
          generate_release_notes: true
          files: release-assets/*
